[package]
name = "eravm-prover-guest"
version = "29.9.0"
edition = "2021"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Build the guest with verify() phase cycle markers, for offline cycle-cost
# calibration ONLY (docs/benchmarking.md). NEVER enable for a proved guest: the
# markers emit CSR 0x7ff, which scripts/check_guest_riscv_code.sh rejects — and
# `relax-version-pin` additionally drops a soundness check.
cycle-markers = ["zksync_airbender_verifier/cycle-markers"]
relax-version-pin = ["zksync_airbender_verifier/relax-version-pin"]
# Calibration-only: swaps main() for a Program::new decode micro-bench used to
# measure the PR#92 re-decode cycle cost. NEVER a shippable guest.
decode-bench = ["dep:zksync_vm2", "dep:primitive-types", "dep:serde"]

[dependencies]
airbender = { workspace = true, features = ["std"] }
zksync_vm2 = { workspace = true, optional = true }
primitive-types = { version = "0.12.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# Explicit path dep (not `workspace = true`) so `default-features = false` is
# honored — Cargo ignores that override on workspace-inherited deps. This drops
# the sequencer-only circuit tracer: the proving guest never reads
# `circuit_statistic`, so it saves in-circuit cycles.
zksync_airbender_verifier = { path = "../crates/airbender_verifier", default-features = false }
